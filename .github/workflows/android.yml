name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed by the "Publish dev release" step below — the default GITHUB_TOKEN is
    # read-only, which fails with "Resource not accessible by integration".
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the changelog step can diff this push's commit range.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Provide default proxy URL for CI build
        run: echo "proxyBaseUrl=http://10.0.2.2:3000/" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Build a changelog from the commits in this push (fallback: last 5 commits).
      - name: Build changelog
        id: changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LOG="$(git log --no-merges --pretty=format:'- %s (%h)' '${{ github.event.before }}..${{ github.sha }}' 2>/dev/null)"
          if [ -z "$LOG" ]; then LOG="$(git log --no-merges -5 --pretty=format:'- %s (%h)')"; fi
          {
            echo 'log<<CHANGELOG_EOF'
            echo "$LOG"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # Publish a rolling "dev" release on every push to main.
      # Anyone with the repo URL can download the APK — no login required.
      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Latest build"
          body: |
            Auto-built from `main` — commit ${{ github.sha }}

            ### Changes in this build
            ${{ steps.changelog.outputs.log }}

            **Install:** sideload onto Fire TV / Google TV via `adb install -r app-debug.apk`
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
